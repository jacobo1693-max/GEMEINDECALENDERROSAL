<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<title>Gemeinde Gottes Rosal — Kalender</title>
<style>
  :root{
    --paper: #FAF7F1;
    --ink: #2B2A28;
    --line: #D8D2C4;
    --navy: #22344A;
    --navy-soft: #3E5877;
    --gold: #B08D4F;
    --red: #A32B2B;
    --green: #3D6B4A;
  }
  * { box-sizing: border-box; }
  html, body {
    margin: 0; padding: 0;
    background: #E9E5DA;
    font-family: "Helvetica Neue", Arial, sans-serif;
    color: var(--ink);
  }
  .wrap {
    max-width: 1000px;
    margin: 0 auto;
    padding: 28px 20px 60px 20px;
  }

  /* ===== Header ===== */
  .header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    border-bottom: 2px solid var(--navy);
    padding-bottom: 14px;
    margin-bottom: 18px;
    flex-wrap: wrap;
    gap: 12px;
  }
  .church-mark { display: flex; align-items: center; gap: 12px; }
  .logo { height: 34px; width: auto; flex-shrink: 0; }
  .church-name {
    font-family: Georgia, serif;
    letter-spacing: 1.5px;
    text-transform: uppercase;
    font-size: 20px;
    font-weight: 700;
    color: var(--navy);
    line-height: 1.2;
  }
  .church-name .sub {
    display: block;
    font-size: 10px;
    letter-spacing: 3px;
    color: var(--gold);
    font-weight: 400;
    margin-top: 2px;
  }

  /* ===== Navigation ===== */
  .nav {
    display: flex;
    align-items: center;
    gap: 10px;
    flex-wrap: wrap;
  }
  .nav button {
    background: var(--navy);
    color: #fff;
    border: none;
    width: 34px; height: 34px;
    border-radius: 50%;
    font-size: 16px;
    cursor: pointer;
    transition: background 0.15s;
  }
  .nav button:hover { background: var(--navy-soft); }
  .print-btn {
    background: var(--gold);
    color: #fff;
    border: none;
    border-radius: 6px;
    padding: 0 16px;
    height: 34px;
    font-size: 12px;
    font-weight: 700;
    letter-spacing: 0.5px;
    cursor: pointer;
    transition: background 0.15s;
  }
  .print-btn:hover { background: #96773d; }
  .print-title { display: none; }
  .nav select {
    font-family: Georgia, serif;
    font-size: 15px;
    font-weight: 700;
    color: var(--navy);
    border: 1px solid var(--line);
    background: #fff;
    border-radius: 6px;
    padding: 6px 10px;
    cursor: pointer;
  }

  /* ===== Calendar card ===== */
  .cal-card {
    background: var(--paper);
    border-radius: 10px;
    padding: 18px 18px 12px 18px;
    box-shadow: 0 4px 18px rgba(0,0,0,0.10);
    margin-bottom: 24px;
  }

  .weekdays {
    display: grid;
    grid-template-columns: repeat(7, 1fr);
    margin-bottom: 4px;
  }
  .weekdays div {
    text-align: center;
    font-size: 10.5px;
    letter-spacing: 0.6px;
    text-transform: uppercase;
    color: var(--navy-soft);
    padding-bottom: 8px;
  }
  .weekdays div.so { color: var(--red); font-weight: 700; }

  .grid {
    display: grid;
    grid-template-columns: repeat(7, 1fr);
    border-top: 1px solid var(--line);
    border-left: 1px solid var(--line);
  }
  .cell {
    border-right: 1px solid var(--line);
    border-bottom: 1px solid var(--line);
    min-height: 92px;
    padding: 6px 6px;
    position: relative;
  }
  .cell.empty { background: repeating-linear-gradient(135deg, transparent, transparent 6px, rgba(0,0,0,0.02) 6px, rgba(0,0,0,0.02) 7px); }
  .cell .num { font-size: 12px; font-weight: 700; color: var(--ink); }
  .cell.sonntag .num { color: var(--red); }
  .cell.heute { outline: 2px solid var(--gold); outline-offset: -2px; }
  .cell .ev {
    font-size: 9.7px;
    line-height: 1.25;
    color: var(--navy-soft);
    margin-top: 3px;
    word-break: break-word;
  }
  .cell .ev + .ev { margin-top: 3px; }

  /* ===== Zukünftiges ===== */
  .future-card {
    background: var(--paper);
    border-radius: 10px;
    padding: 18px 20px;
    box-shadow: 0 4px 18px rgba(0,0,0,0.10);
  }
  .future-title {
    display: flex;
    align-items: center;
    gap: 8px;
    font-size: 15px;
    font-weight: 700;
    letter-spacing: 1px;
    text-transform: uppercase;
    color: var(--navy);
    border-bottom: 2px solid var(--navy);
    padding-bottom: 8px;
    margin-bottom: 10px;
  }
  .future-item {
    display: flex;
    gap: 14px;
    padding: 9px 0;
    border-bottom: 1px solid var(--line);
  }
  .future-item:last-child { border-bottom: none; }
  .future-item .fdate {
    flex-shrink: 0;
    width: 130px;
    font-size: 11px;
    font-weight: 700;
    color: var(--green);
    letter-spacing: 0.3px;
  }
  .future-item .ftext .ftitle {
    font-size: 13px;
    font-weight: 700;
    color: var(--ink);
  }
  .future-item .ftext .fdesc {
    font-size: 11.5px;
    color: var(--navy-soft);
    margin-top: 1px;
  }

  .empty-note {
    font-size: 12px;
    color: var(--navy-soft);
    font-style: italic;
    padding: 8px 0;
  }

  @media (max-width: 560px) {
    .cell { min-height: 70px; padding: 4px; }
    .cell .ev { font-size: 8.5px; }
    .weekdays div { font-size: 8.5px; }
    .future-item { flex-direction: column; gap: 2px; }
    .future-item .fdate { width: auto; }
  }

  /* ===== Druckansicht (tamaño carta) ===== */
  @media print {
    @page { size: letter portrait; margin: 0.35in; }
    html, body { background: #fff; }
    * { -webkit-print-color-adjust: exact !important; print-color-adjust: exact !important; }
    .wrap { max-width: 100%; padding: 0; }
    .nav select, .print-btn, #prevBtn, #nextBtn { display: none !important; }
    .print-title {
      display: block !important;
      font-family: Georgia, serif;
      font-size: 20px;
      font-weight: 700;
      color: var(--navy);
      text-transform: uppercase;
      letter-spacing: 1px;
    }
    .header { margin-bottom: 10px; padding-bottom: 8px; }
    .cal-card, .future-card { box-shadow: none; border: 1px solid var(--line); page-break-inside: avoid; }
    .cal-card { margin-bottom: 12px; padding: 10px; }
    .cell { min-height: 62px; padding: 3px 4px; }
    .cell .ev { font-size: 8px; }
    .future-card { padding: 10px 14px; }
    .future-item { padding: 5px 0; }
  }
</style>
</head>

    "2026-11-21": ["7:00 am – Männer-Gebetsfrühstück"],
    "2026-11-22": ["10:00 am – Verordnung: Abendmahl", "Keine Sonntagschule"],
    "2026-12-17": ["Weihnachtsprogramm der Schule"],
    "2026-12-19": ["Kein Männer-Gebetsfrühstück"],
    "2026-12-23": ["Keine Gebetstunde"],
    "2026-12-25": ["10:00 am – Weihnachtsbotschaft"],
    "2026-12-30": ["6:30 pm – Gitarrenüben", "Keine Gebetstunde und Kinderstunde"],
    "2026-12-31": ["6:00 pm – Silvesterabend"],
    "2027-01-20": ["6:30 pm – Geschäftsversammlung"],
    "2027-05-12": ["Musikabend der Schule"]
  };

  // ===== Wöchentliche Regeln (gelten für alle Monate, außer an Tagen mit festen Ereignissen oben) =====
  // Mittwoch: immer 7:30 – Gebetstunde. Am letzten Mittwoch des Monats zusätzlich Kinderstunde.
  // Freitag: immer 7:30 – Jugendstunde. Am letzten Freitag des Monats stattdessen 7:00 – Jugendstunde in Neustädt.
  function isLastWeekdayOfMonth(year, month, day, weekday) {
    const daysInMonth = new Date(year, month + 1, 0).getDate();
    for (let d = day + 1; d <= daysInMonth; d++) {
      if (new Date(year, month, d).getDay() === weekday) return false;
    }
    return true;
  }

  // Prüft, ob dieser Mittwoch der Mittwoch direkt vor dem ersten Sonntag
  // des (eventuell nächsten) Monats ist.
  function isWednesdayBeforeFirstSunday(year, month, day) {
    const nextSunday = new Date(year, month, day + 4); // Mittwoch + 4 Tage = Sonntag
    return nextSunday.getDate() <= 7;
  }

  // Basis-Monat für den abwechselnden Chor-Rhythmus: August 2026 = Frauenchor.
  function isFrauenchorMonth(year, month) {
    const monthsSinceBase = (year - 2026) * 12 + (month - 7);
    return ((monthsSinceBase % 2) + 2) % 2 === 0;
  }

  // "Centro Luz en mi Camino": immer der 2. Montag des Monats, alle 3 Monate
  // ab September 2026, mit abwechselnder Gruppe (Gruppe 2 zuerst, dann Gruppe 1, usw.).
  function nthWeekdayOfMonth(year, month, weekday, n) {
    const firstWeekday = new Date(year, month, 1).getDay();
    return 1 + ((7 + weekday - firstWeekday) % 7) + (n - 1) * 7;
  }
  function isCentroLuzMonth(year, month) {
    const baseIndex = 2026 * 12 + 8; // September 2026
    const diff = year * 12 + month - baseIndex;
    return diff >= 0 && diff % 3 === 0;
  }
  function centroLuzGroup(year, month) {
    const baseIndex = 2026 * 12 + 8;
    const occurrence = (year * 12 + month - baseIndex) / 3;
    return occurrence % 2 === 0 ? 2 : 1;
  }
  function centroLuzInfo(year, month, day) {
    if (!isCentroLuzMonth(year, month)) return null;
    const secondMonday = nthWeekdayOfMonth(year, month, 1, 2); // Montag = 1
    if (day !== secondMonday) return null;
    return centroLuzGroup(year, month);
  }

  // Gemeinschaftsabend: alle 2 Monate ab September 2026, immer am 3. Sonntag,
  // abwechselnd im Gym / in den Häusern.
  function isGemeinschaftsabendMonth(year, month) {
    const baseIndex = 2026 * 12 + 8; // September 2026
    const diff = year * 12 + month - baseIndex;
    return diff >= 0 && diff % 2 === 0;
  }
  function gemeinschaftsabendOrt(year, month) {
    const baseIndex = 2026 * 12 + 8;
    const occurrence = (year * 12 + month - baseIndex) / 2;
    return occurrence % 2 === 0 ? "im Gym" : "in den Häusern";
  }

  function getRecurringEvents(year, month, day) {
    const dow = new Date(year, month, day).getDay();
    const result = [];
    if (dow === 3) { // Mittwoch
      if (isWednesdayBeforeFirstSunday(year, month, day)) {
        result.push("6:30 pm – Gitarrenüben");
      }
      if (isLastWeekdayOfMonth(year, month, day, 3)) {
        result.push("7:30 pm – Gebetstunde und Kinderstunde");
      } else {
        result.push("7:30 pm – Gebetstunde");
      }
    }
    if (dow === 5) { // Freitag
      if (isLastWeekdayOfMonth(year, month, day, 5)) {
        result.push("7:00 pm – Jugendstunde in Neustädt");
      } else {
        result.push("7:30 pm – Jugendstunde");
      }
    }
    if (dow === 4 && (year * 12 + month) < (2026 * 12 + 9)) { // Donnerstag, nur vor Oktober 2026
      const occurrence = Math.floor((day - 1) / 7) + 1;
      if (occurrence === 2) {
        result.push("Kein Frauen-Bibelstudium und Gebetsstunde");
      } else if (isLastWeekdayOfMonth(year, month, day, 4)) {
        result.push("Kein Frauen-Bibelstudium");
      }
    }
    if (dow === 0) { // Sonntag
      const occurrence = Math.floor((day - 1) / 7) + 1; // 1. bis 5. Sonntag des Monats
      if (occurrence === 1) {
        result.push(isFrauenchorMonth(year, month) ? "Frauenchor üben" : "Gemeindechor üben");
      }
      if (occurrence === 4) {
        result.push("Kinderchor üben");
      }
      result.push("10:00 am – Hauptgottesdienst und Sonntagsschule");
      if (occurrence === 2) {
        result.push("5:00 pm – Mini-Jugend");
      }
      if (occurrence === 3) {
        result.push("Worship-Team – besonderer Gesang");
        if (isGemeinschaftsabendMonth(year, month)) {
          const ort = gemeinschaftsabendOrt(year, month);
          const detalle = ort === "im Gym"
            ? "jeder bringt Essen und Getränke mit, Kaffee wird gestellt"
            : "jeder bringt Essen mit, der Hausbesitzer sorgt für die Getränke";
          result.push(`5:00 pm – Gemeinschaftsabend ${ort}: ${detalle}`);
        }
      }
    }

    const gruppe = centroLuzInfo(year, month, day);
    if (gruppe !== null) {
      result.push(`7:00 pm – Programm Centro Luz en mi Camino (Gruppe ${gruppe})`);
      result.push("Wenn es dir nicht möglich ist mitzumachen, suche dir bitte selbst einen Ersatz, damit die Gruppe vollständig ist");
      result.push("Bitte bring auch dein Glaubenslieder-Buch mit");
    }

    return result;
  }

  // ===== Zukünftiges (kurze Beschreibung) =====
  const futureEvents = [
    { start: "2026-08-14", end: "2026-08-16", title: "Gemeindeausflug", desc: "Neustädt und Rosal in Sainapuchi" },
    { start: "2026-09-23", end: "2026-09-25", title: "Abendversammlungen", desc: "Täglich 7:30 pm, mit Br. David Knelsen" },
    { start: "2026-09-24", title: "Frauenfrühstück und Bibelstudium", desc: "9:00 am – Restaurant La Huerta km 10, mit Karina Knelsen" },
    { start: "2026-09-26", title: "Männer-Gebetsfrühstück", desc: "7:00 am – Pizzería La Sierra km 6, mit Br. David Knelsen" },
    { start: "2026-09-27", title: "Gottesdienst mit Br. David Knelsen", desc: "10:00 am, danach gemeinsames Mittagessen im Gym" },
    { start: "2026-10-17", title: "Männer-Gebetsfrühstück", desc: "7:00 am" },
    { start: "2026-10-18", title: "Männer- und Jungsabend", desc: "3:30 pm – Gimnasio Campo 101, Film 'The Forge / La Forja', danach Abendessen" },
    { start: "2026-11-08", title: "Erntedankfest", desc: "10:00 am – mit gemeinsamem Mittagessen" },
    { start: "2026-11-21", title: "Männer-Gebetsfrühstück", desc: "7:00 am" },
    { start: "2026-11-22", title: "Verordnung: Abendmahl", desc: "10:00 am – Keine Sonntagschule" },
    { start: "2026-12-17", title: "Weihnachtsprogramm der Schule", desc: "" },
    { start: "2026-12-19", title: "Kein Männer-Gebetsfrühstück", desc: "" },
    { start: "2026-12-25", title: "Weihnachtsbotschaft", desc: "10:00 am" },
    { start: "2026-12-31", title: "Silvesterabend", desc: "6:00 pm" },
    { start: "2027-01-20", title: "Geschäftsversammlung", desc: "6:30 pm" },
    { start: "2027-05-12", title: "Musikabend der Schule", desc: "" }
  ];

  const monthNames = ["Januar","Februar","März","April","Mai","Juni","Juli","August","September","Oktober","November","Dezember"];

  const monthSelect = document.getElementById('monthSelect');
  const yearSelect = document.getElementById('yearSelect');
  monthNames.forEach((m,i) => {
    const opt = document.createElement('option');
    opt.value = i; opt.textContent = m;
    monthSelect.appendChild(opt);
  });
  const YEAR_START = 2026, YEAR_END = 2060;
  for (let y = YEAR_START; y <= YEAR_END; y++) {
    const opt = document.createElement('option');
    opt.value = y; opt.textContent = y;
    yearSelect.appendChild(opt);
  }

  let current = { year: 2026, month: 7 }; // August 2026 (0-indexiert)

  function pad(n){ return n.toString().padStart(2,'0'); }
  function dateKey(y,m,d){ return `${y}-${pad(m+1)}-${pad(d)}`; }
  function formatShort(dateStr){
    const [y,m,d] = dateStr.split('-').map(Number);
    return `${d}. ${monthNames[m-1].slice(0,3)}. ${y}`;
  }

  function render() {
    monthSelect.value = current.month;
    yearSelect.value = current.year;
    document.getElementById('printTitle').textContent = monthNames[current.month] + ' ' + current.year;

    const grid = document.getElementById('grid');
    grid.innerHTML = '';

    const firstDay = new Date(current.year, current.month, 1);
    const startWeekday = firstDay.getDay(); // 0 = Sonntag
    const daysInMonth = new Date(current.year, current.month + 1, 0).getDate();
    const totalCells = Math.ceil((startWeekday + daysInMonth) / 7) * 7;

    const today = new Date();
    const isCurrentMonth = today.getFullYear() === current.year && today.getMonth() === current.month;

    for (let i = 0; i < totalCells; i++) {
      const dayNum = i - startWeekday + 1;
      const cell = document.createElement('div');
      cell.className = 'cell';
      const col = i % 7;

      if (dayNum < 1 || dayNum > daysInMonth) {
        cell.classList.add('empty');
      } else {
        if (col === 0) cell.classList.add('sonntag');
        if (isCurrentMonth && dayNum === today.getDate()) cell.classList.add('heute');

        const num = document.createElement('div');
        num.className = 'num';
        num.textContent = dayNum;
        cell.appendChild(num);

        const key = dateKey(current.year, current.month, dayNum);
        // Feste Ereignisse überschreiben die wöchentliche Regel; sonst gilt die Regel automatisch.
        const dayEvents = events[key] || getRecurringEvents(current.year, current.month, dayNum);
        dayEvents.forEach(txt => {
          const ev = document.createElement('div');
          ev.className = 'ev';
          ev.textContent = txt;
          cell.appendChild(ev);
        });
      }
      grid.appendChild(cell);
    }

    renderFuture();
  }

  function getUpcomingCentroLuz(thresholdKey, windowEndKey, count) {
    const [ty, tm] = thresholdKey.split('-').map(Number);
    let year = ty, month = tm - 1;
    const results = [];
    for (let i = 0; i < 48 && results.length < count; i++) {
      if (isCentroLuzMonth(year, month)) {
        const day = nthWeekdayOfMonth(year, month, 1, 2);
        const key = dateKey(year, month, day);
        if (key >= thresholdKey && key <= windowEndKey) {
          const gruppe = centroLuzGroup(year, month);
          results.push({
            start: key,
            title: "Programm Centro Luz en mi Camino",
            desc: `7:00 pm – Gruppe ${gruppe}`
          });
        }
      }
      month++;
      if (month > 11) { month = 0; year++; }
    }
    return results;
  }

  function getUpcomingGemeinschaftsabend(thresholdKey, windowEndKey, count) {
    const [ty, tm] = thresholdKey.split('-').map(Number);
    let year = ty, month = tm - 1;
    const results = [];
    for (let i = 0; i < 48 && results.length < count; i++) {
      if (isGemeinschaftsabendMonth(year, month)) {
        const day = nthWeekdayOfMonth(year, month, 0, 3); // 3. Sonntag (Sonntag = 0)
        const key = dateKey(year, month, day);
        if (key >= thresholdKey && key <= windowEndKey) {
          const ort = gemeinschaftsabendOrt(year, month);
          const detalle = ort === "im Gym"
            ? "jeder bringt Essen und Getränke mit"
            : "jeder bringt Essen mit, der Hausbesitzer sorgt für die Getränke";
          results.push({
            start: key,
            title: "Gemeinschaftsabend",
            desc: `5:00 pm ${ort} – ${detalle}`
          });
        }
      }
      month++;
      if (month > 11) { month = 0; year++; }
    }
    return results;
  }

  function renderFuture() {
    const list = document.getElementById('futureList');
    list.innerHTML = '';

    // Grenze = erster Tag des GERADE ANGEZEIGTEN Monats (nicht das echte "heute").
    // So verschwinden vergangene Ereignisse automatisch, sobald man im Kalender weiterblättert.
    const thresholdKey = dateKey(current.year, current.month, 1);
    // Nur Ereignisse zeigen, die höchstens 1 Monat im Voraus liegen.
    let windowYear = current.year, windowMonth = current.month + 1;
    if (windowMonth > 11) { windowMonth = 0; windowYear++; }
    const windowLastDay = new Date(windowYear, windowMonth + 1, 0).getDate();
    const windowEndKey = dateKey(windowYear, windowMonth, windowLastDay);

    const upcoming = futureEvents.filter(ev => {
      const endOrStart = ev.end || ev.start;
      return endOrStart >= thresholdKey && ev.start <= windowEndKey;
    });
    const upcomingCentroLuz = getUpcomingCentroLuz(thresholdKey, windowEndKey, 1);
    const upcomingGemeinschaft = getUpcomingGemeinschaftsabend(thresholdKey, windowEndKey, 1);
    const sorted = [...upcoming, ...upcomingCentroLuz, ...upcomingGemeinschaft].sort((a,b) => a.start.localeCompare(b.start));

    if (sorted.length === 0) {
      list.innerHTML = '<div class="empty-note">Keine bevorstehenden Ereignisse.</div>';
      return;
    }

    sorted.forEach(ev => {
      const item = document.createElement('div');
      item.className = 'future-item';

      const dateLabel = ev.end
        ? `${formatShort(ev.start)} – ${formatShort(ev.end)}`
        : formatShort(ev.start);

      item.innerHTML = `
        <div class="fdate">${dateLabel}</div>
        <div class="ftext">
          <div class="ftitle">${ev.title}</div>
          <div class="fdesc">${ev.desc}</div>
        </div>`;
      list.appendChild(item);
    });
  }

  document.getElementById('printBtn').addEventListener('click', () => {
    window.print();
  });

  document.getElementById('prevBtn').addEventListener('click', () => {
    current.month--;
    if (current.month < 0) { current.month = 11; current.year--; }
    if (current.year < YEAR_START) { current.year = YEAR_START; current.month = 0; }
    render();
  });
  document.getElementById('nextBtn').addEventListener('click', () => {
    current.month++;
    if (current.month > 11) { current.month = 0; current.year++; }
    if (current.year > YEAR_END) { current.year = YEAR_END; current.month = 11; }
    render();
  });
  monthSelect.addEventListener('change', () => { current.month = parseInt(monthSelect.value); render(); });
  yearSelect.addEventListener('change', () => { current.year = parseInt(yearSelect.value); render(); });

  render();
</script>
